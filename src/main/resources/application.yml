spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chaocommunity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 15
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ljc.entity
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 输出SQL日志
  global-config:
    db-config:
      logic-delete-field: deleted  # 逻辑删除字段名（实体类中的属性名）
      logic-delete-value: 1        # 已删除的值
      logic-not-delete-value: 0    # 未删除的值

# 阿里云 OSS 配置（AccessKey 从环境变量读取）
oss:
  endpoint: https://oss-cn-beijing.aliyuncs.com
  region: cn-beijing
  bucket-name: chaocommunity-file
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}